```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Real Estate Calling Agent — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
  header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 600; }
  header p { font-size: 13px; color: #64748b; margin-top: 2px; }
  #refresh { font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
  #refresh:hover { background: #f1f5f9; }
  .layout { display: flex; height: calc(100vh - 65px); }
  #callList { width: 320px; border-right: 1px solid #e2e8f0; background: #fff; overflow-y: auto; }
  .callItem { width: 100%; text-align: left; padding: 12px 16px; border-bottom: 1px solid #f1f5f9; background: none; border-left: 2px solid transparent; cursor: pointer; display: block; }
  .callItem:hover { background: #f8fafc; }
  .callItem.selected { background: #f8fafc; border-left-color: #0f172a; }
  .callItem .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .callItem .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .callItem .date { font-size: 12px; color: #64748b; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid; }
  .badge.completed { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .badge.progress { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .badge.failed { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .badge.unknown { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
  main { flex: 1; overflow-y: auto; padding: 24px; }
  .empty { color: #94a3b8; text-align: center; margin-top: 40px; font-size: 14px; }
  .detail { max-width: 720px; margin: 0 auto; }
  .detail h2 { font-size: 20px; font-weight: 600; }
  .detail .meta { font-size: 13px; color: #64748b; margin-top: 4px; }
  section.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-top: 20px; }
  section.card h3 { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 10px; }
  audio { width: 100%; }
  .transcript { font-size: 14px; color: #334155; white-space: pre-wrap; line-height: 1.6; }
  .muted { font-size: 14px; color: #94a3b8; }
  .msg { padding: 16px; font-size: 14px; }
  .msg.error { color: #b91c1c; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Real Estate Calling Agent</h1>
    <p>Call log &amp; recordings dashboard</p>
  </div>
  <button id="refresh">Refresh</button>
</header>

<div class="layout">
  <aside id="callList"></aside>
  <main id="detailPanel">
    <div class="empty">Ek call select karein details dekhne ke liye.</div>
  </main>
</div>

<script>
  const API_BASE_URL = "https://honest-mercy-production-4c55.up.railway.app";
  let calls = [];
  let selectedId = null;

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function badgeHtml(status) {
    const s = (status || "unknown").toLowerCase();
    const cls = s === "completed" ? "completed" : (s.includes("progress") ? "progress" : (s === "failed" ? "failed" : "unknown"));
    return `<span class="badge ${cls}">${status || "Unknown"}</span>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderList() {
    const listEl = document.getElementById("callList");
    if (calls.length === 0) {
      listEl.innerHTML = `<div class="msg">Abhi tak koi call record nahi hai. Jaise hi ek call complete hogi aur webhook se save hogi, yahan dikhegi.</div>`;
      return;
    }
    listEl.innerHTML = calls.map(call => `
      <button class="callItem ${call.id === selectedId ? 'selected' : ''}" data-id="${call.id}">
        <div class="row">
          <span class="name">${escapeHtml(call.lead_name || call.phone_number || "Unknown lead")}</span>
          ${badgeHtml(call.status)}
        </div>
        <div class="date">${formatDate(call.created_at || call.call_time)}</div>
      </button>
    `).join("");

    listEl.querySelectorAll(".callItem").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedId = btn.getAttribute("data-id");
        renderList();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    const panel = document.getElementById("detailPanel");
    const call = calls.find(c => String(c.id) === String(selectedId));
    if (!call) {
      panel.innerHTML = `<div class="empty">Ek call select karein details dekhne ke liye.</div>`;
      return;
    }

    let extractedHtml = "";
    if (call.total_flats || call.availability || call.amenities || call.pricing) {
      extractedHtml = `
        <section class="card">
          <h3>Extracted Info</h3>
          ${call.total_flats ? `<p><strong>Total flats:</strong> ${escapeHtml(String(call.total_flats))}</p>` : ""}
          ${call.availability ? `<p><strong>Availability:</strong> ${escapeHtml(String(call.availability))}</p>` : ""}
          ${call.amenities ? `<p><strong>Amenities:</strong> ${escapeHtml(String(call.amenities))}</p>` : ""}
          ${call.pricing ? `<p><strong>Pricing:</strong> ${escapeHtml(String(call.pricing))}</p>` : ""}
        </section>`;
    }

    const transcriptText = call.transcript
      ? (typeof call.transcript === "string" ? call.transcript : JSON.stringify(call.transcript, null, 2))
      : null;

    panel.innerHTML = `
      <div class="detail">
        <h2>${escapeHtml(call.lead_name || call.phone_number || "Call detail")}</h2>
        <div class="meta">${formatDate(call.created_at || call.call_time)} · ${escapeHtml(call.phone_number || "No number")}</div>
        <div style="margin-top:8px;">${badgeHtml(call.status)}</div>

        <section class="card">
          <h3>Recording</h3>
          ${call.recording_url
            ? `<audio controls src="${call.recording_url}">Your browser does not support audio playback.</audio>`
            : `<p class="muted">Recording abhi available nahi hai.</p>`}
        </section>

        ${extractedHtml}

        <section class="card">
          <h3>Transcript</h3>
          ${transcriptText
            ? `<div class="transcript">${escapeHtml(transcriptText)}</div>`
            : `<p class="muted">Transcript abhi available nahi hai.</p>`}
        </section>
      </div>
    `;
  }

  async function fetchCalls() {
    const listEl = document.getElementById("callList");
    listEl.innerHTML = `<div class="msg">Loading calls…</div>`;
    try {
      const res = await fetch(`${API_BASE_URL}/api/calls`);
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();
      calls = Array.isArray(data) ? data : (data.calls || []);
      if (calls.length > 0 && selectedId === null) {
        selectedId = calls[0].id;
      }
      renderList();
      renderDetail();
    } catch (err) {
      listEl.innerHTML = `<div class="msg error">Calls load nahi ho paye. Backend chal raha hai ya nahi check karein: ${escapeHtml(err.message)}</div>`;
    }
  }

  document.getElementById("refresh").addEventListener("click", fetchCalls);
  fetchCalls();
</script>

</body>
</html>
